<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>The Invitation</title>
</head>
<body style="background-color: #121212; color: #cccccc; font-family: 'Courier New', Courier, monospace; padding: 40px 10px; margin: 0; text-align: center;">

    <div style="max-width: 500px; margin: 0 auto; background-color: #1a1a1a; padding: 40px 30px; border: 1px solid #333333;">

        <h1 style="color: #ffffff; letter-spacing: 5px; font-weight: normal; margin-top: 0; margin-bottom: 30px; border-bottom: 1px solid #333333; padding-bottom: 20px;">
            THE <span style="text-transform: uppercase;">{{.Status}}</span> CIRCLE
        </h1>

        <p style="font-size: 16px; line-height: 1.6; margin-bottom: 30px;">
            {{.Alias}}
        </p>
        <br><br>
            The cycle turns. The lock to the inner archive is changed. You have 24 hours before the key changes
        <p style="font-size: 14px; color: #888888; margin-bottom: 10px; text-transform: uppercase;">
            Your Access Key
        </p>

        <div style="background-color: #000000; color: #cc0000; padding: 15px; font-size: 22px; letter-spacing: 3px; border: 1px dashed #444444; margin-bottom: 30px;">
            {{.SitePassword}}
        </div>

        <p style="font-size: 12px; color: #555555; line-height: 1.5; margin-bottom: 0;">
            Keep this key secure. If you are not ready, delete this message and we will not contact you again.
        </p>

    </div>

</body>
</html>
