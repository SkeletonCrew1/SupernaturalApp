apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-supernatural
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: bholovchak98@gmail.com
    privateKeySecretRef:
      name: letsencrypt-supernatural-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token-secret
              key: api-token
