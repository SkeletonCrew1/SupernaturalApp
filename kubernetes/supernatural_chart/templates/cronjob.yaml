{{- range .Values.services  }}
{{- if .hasCron }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .name }}-cronjob
  namespace: app
spec:
  schedule: {{ .schedule | quote }}
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: {{ .name }}
          {{- if .isPartOfConsul }}
          annotations:
            consul.hashicorp.com/connect-inject: 'true'
            consul.hashicorp.com/connect-service: '{{ .serviceAccountName }}'
            consul.hashicorp.com/transparent-proxy-exclude-outbound-ports: "5432"
            consul.hashicorp.com/sidecar-proxy-lifecycle-shutdown-grace-period-seconds: "5"
          {{- end }}
        spec:
          serviceAccountName: {{ .serviceAccountName }}
          restartPolicy: OnFailure
          containers:
            - name: {{ .name }}
              image: {{ .image }}
              {{- if eq .name "password-generator" }}
              command:
                - /bin/sh
                - -c
                - |
                  echo "Waiting for mail-service to be reachable..."
                  ATTEMPTS=0
                  MAX_ATTEMPTS=15
                  until wget -q -T 2 -O /dev/null http://mail-service:8074/health; do
                    ATTEMPTS=$((ATTEMPTS+1))
                    if [ "$ATTEMPTS" -ge "$MAX_ATTEMPTS" ]; then
                      echo "mail-service did not become reachable in time, exiting"
                      exit 1
                    fi
                    echo "mail-service not ready yet, retrying in 2s (attempt $ATTEMPTS/$MAX_ATTEMPTS)..."
                    sleep 2
                  done
                  echo "mail-service is reachable, proceeding"

                  /password_generator/main
                  EXIT_CODE=$?
                  wget -q -T 2 --post-data='' -O /dev/null http://127.0.0.1:20600/graceful_shutdown
                  sleep 10
                  echo "Sidecar killed"
                  exit $EXIT_CODE
              env:
                - name: DSN
                  valueFrom:
                   secretKeyRef:
                     name: app-aws-secrets-map
                     key: DSN
              volumeMounts:
              - name: secrets-volume
                mountPath: "/mnt/secrets"
                readOnly: true
              {{- end }}
              resources:
                requests:
                  cpu: "150m"
                  memory: "256Mi"
                limits:
                  cpu: "500m"
                  memory: "512Mi"
          {{- if eq .name "password-generator" }}
          volumes:
            - name: secrets-volume
              csi:
                driver: secrets-store.csi.k8s.io
                readOnly: true
                volumeAttributes:
                  secretProviderClass: "aws-secrets-all"
          {{- end }}
{{- end }}
{{- end }}
