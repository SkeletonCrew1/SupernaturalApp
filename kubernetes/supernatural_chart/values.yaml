#default values
global:
  env: dev
services:
  cleanup:
    #specifying if service should have HorizontalAutoScaling and Service
    hasHorizontalAutoScaling: true
    hasService: true
    hasDeployment: true
    hasCron: false

    # deployment vars
    name: cleanup
    isPartOfConsul: true
    serviceAccountName: cleanup #for mail it's mail-service
    image: 984546305184.dkr.ecr.eu-north-1.amazonaws.com/masonic/cleanup:latest
    containerPort: 8585 #used for container port and liveness port
    getCheck: true
    #horizontal_auto_scaling vars


