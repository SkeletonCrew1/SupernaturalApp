apiVersion: consul.hashicorp.com/v1alpha1
kind: ServiceDefaults
metadata:
  name: cleanup
  namespace: app
spec:
  protocol: http
---
apiVersion: consul.hashicorp.com/v1alpha1
kind: ServiceIntentions
metadata:
  name: cleanup-intentions
  namespace: app
spec:
  destination:
    name: cleanup
  sources:
    - name: api-gateway
      action: allow
    - name: frontend
      action: allow
    - name: "*"
      action: deny
